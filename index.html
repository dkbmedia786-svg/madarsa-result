<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Madarsa Result - Admin Panel</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        
        body { background: linear-gradient(135deg, #1e5631, #a4be7b); min-height: 100vh; padding: 20px; }

        .container { max-width: 1000px; margin: auto; background: white; border-radius: 20px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }

        h1 { text-align: center; color: #1e5631; margin-bottom: 10px; }
        h2 { color: #1e5631; margin: 20px 0 10px 0; }

        /* Login Form */
        #loginSection { max-width: 400px; margin: 100px auto; text-align: center; }
        #loginSection input { display: block; width: 100%; margin: 10px 0; padding: 15px; font-size: 16px; border: 2px solid #1e5631; border-radius: 10px; }
        #loginSection button { width: 100%; padding: 15px; background: #1e5631; color: white; border: none; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; }
        .error { color: red; text-align: center; display: none; margin-top: 10px; }

        /* Admin Panel - Hidden by default */
        #adminPanel { display: none; }

        /* Tabs */
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab { padding: 12px 24px; background: #ddd; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .tab.active { background: #1e5631; color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Form */
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .form-grid input, .form-grid select, .form-grid textarea { width: 100%; padding: 12px; border: 2px solid #1e5631; border-radius: 8px; font-size: 14px; }
        .full-width { grid-column: span 2; }

        .btn-group { display: flex; gap: 10px; margin-top: 15px; }
        .btn { padding: 12px 24px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; color: white; }
        .btn-primary { background: #1e5631; }
        .btn-success { background: #27ae60; }
        .btn-danger { background: #e74c3c; }
        .btn-secondary { background: #7f8c8d; }

        /* Table */
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #1e5631; padding: 10px; text-align: center; }
        th { background: #1e5631; color: white; }
        tr:nth-child(even) { background: #f0f0f0; }

        /* Marks Input Grid */
        .marks-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-top: 15px; }
        .marks-grid input { width: 100%; padding: 10px; text-align: center; border: 2px solid #1e5631; border-radius: 8px; }

        .logout-btn { float: right; background: #e74c3c; padding: 10px 20px; }

        @media print { body { background: white; } .no-print { display: none; } }
    </style>
</head>
<body>

<div class="container">
    <!-- Login Section -->
    <div id="loginSection">
        <h1>🏫 Madarsa Result Admin</h1>
        <p style="color:#666; margin-bottom:20px;">Admin Login</p>
        <input type="text" id="username" placeholder="Username (admin)">
        <input type="password" id="password" placeholder="Password (admin123)">
        <button onclick="login()">🔐 Login</button>
        <p class="error" id="loginError">❌ Invalid username or password</p>
    </div>

    <!-- Admin Panel -->
    <div id="adminPanel">
        <button class="btn logout-btn" onclick="logout()">🚪 Logout</button>
        <h1>🏫 Madarsa Arabia Noorul Uloom</h1>
        <p style="color:#666;">Admin Panel - Student Result Management</p>

        <!-- Tabs -->
        <div class="tabs no-print">
            <button class="tab active" onclick="showTab('addStudent')">➕ Add Student</button>
            <button class="tab" onclick="showTab('viewStudents')">👥 View All Students</button>
            <button class="tab" onclick="showTab('exportData')">📤 Export Data</button>
        </div>

        <!-- Add Student Tab -->
        <div id="addStudent" class="tab-content active">
            <h2>➕ Add New Student</h2>
            <div class="form-grid">
                <input type="text" id="sname" placeholder="Student Name *" class="full-width">
                <input type="text" id="fname" placeholder="Father Name *">
                <input type="text" id="mname" placeholder="Mother Name">
                <input type="text" id="roll" placeholder="Roll Number *" class="full-width">
                <select id="sclass">
                    <option value="">Select Class *</option>
                    <option value="Nursery">Nursery</option>
                    <option value="1st">Class 1st</option>
                    <option value="2nd">Class 2nd</option>
                    <option value="3rd">Class 3rd</option>
                    <option value="4th">Class 4th</option>
                    <option value="5th">Class 5th</option>
                    <option value="6th">Class 6th</option>
                    <option value="7th">Class 7th</option>
                    <option value="8th">Class 8th</option>
                    <option value="9th">Class 9th</option>
                    <option value="10th">Class 10th</option>
                </select>
                <select id="syear">
                    <option value="">Select Year</option>
                    <option value="2025">2025</option>
                    <option value="2024">2024</option>
                    <option value="2023">2023</option>
                </select>
                <input type="text" id="sdob" placeholder="Date of Birth (DD-MM-YYYY)">
                <input type="text" id="saddress" placeholder="Address" class="full-width">
                
                <div class="full-width">
                    <h3 style="margin: 15px 0 10px 0;">📝 Enter Marks (Out of 100)</h3>
                    <div class="marks-grid">
                        <input type="number" id="m1" placeholder="Quran">
                        <input type="number" id="m2" placeholder="Hifz">
                        <input type="number" id="m3" placeholder="Deeniyat">
                        <input type="number" id="m4" placeholder="Urdu">
                        <input type="number" id="m5" placeholder="English">
                        <input type="number" id="m6" placeholder="Hindi">
                        <input type="number" id="m7" placeholder="Science">
                        <input type="number" id="m8" placeholder="Social">
                        <input type="number" id="m9" placeholder="Math">
                        <input type="number" id="m10" placeholder="Dua">
                    </div>
                </div>
            </div>

            <div class="btn-group">
                <button class="btn btn-success" onclick="saveStudent()">💾 Save Student</button>
                <button class="btn btn-secondary" onclick="clearForm()">🆕 Clear Form</button>
                <button class="btn btn-primary" onclick="loadAllStudents()">📋 View All</button>
            </div>
        </div>

        <!-- View Students Tab -->
        <div id="viewStudents" class="tab-content">
            <div style="display:flex; gap:10px; margin-bottom:15px;">
                <input type="text" id="searchStudent" placeholder="Search by name or roll..." onkeyup="searchStudents()" style="flex:1; padding:12px; border:2px solid #1e5631; border-radius:8px;">
                <select id="filterClass" onchange="filterByClass()" style="padding:12px; border:2px solid #1e5631; border-radius:8px;">
                    <option value="">All Classes</option>
                    <option value="Nursery">Nursery</option>
                    <option value="1st">1st</option>
                    <option value="2nd">2nd</option>
                    <option value="3rd">3rd</option>
                    <option value="4th">4th</option>
                    <option value="5th">5th</option>
                    <option value="6th">6th</option>
                    <option value="7th">7th</option>
                    <option value="8th">8th</option>
                    <option value="9th">9th</option>
                    <option value="10th">10th</option>
                </select>
            </div>
            <table id="studentTable">
                <thead>
                    <tr><th>Roll</th><th>Name</th><th>Class</th><th>Year</th><th>Total</th><th>%</th><th>Rank</th><th>Action</th></tr>
                </thead>
                <tbody id="studentBody"></tbody>
            </table>
        </div>

        <!-- Export Tab -->
        <div id="exportData" class="tab-content">
            <h2>📤 Export / Import Data</h2>
            <div class="btn-group">
                <button class="btn btn-primary" onclick="exportJSON()">📥 Download JSON</button>
                <button class="btn btn-secondary" onclick="document.getElementById('importFile').click()">📤 Import JSON</button>
                <input type="file" id="importFile" accept=".json" style="display:none;" onchange="importJSON(event)">
                <button class="btn btn-success" onclick="exportExcel()">📊 Export Excel</button>
            </div>
            <div style="margin-top:20px;">
                <button class="btn btn-danger" onclick="clearAllData()">🗑️ Delete All Data (Warning!)</button>
            </div>
            <div style="margin-top:30px; padding:20px; background:#f0f0f0; border-radius:10px;">
                <h3>📊 Statistics</h3>
                <p>Total Students: <strong id="totalStudents">0</strong></p>
                <p>Pass: <strong id="totalPass">0</strong></p>
                <p>Fail: <strong id="totalFail">0</strong></p>
            </div>
        </div>
    </div>
</div>

<script>
// Login Credentials
const ADMIN_USER = "admin";
const ADMIN_PASS = "admin123";

// Data Storage Key
const DATA_KEY = "madarsa_students";

function login() {
    let user = document.getElementById('username').value;
    let pass = document.getElementById('password').value;
    
    if(user === ADMIN_USER && pass === ADMIN_PASS) {
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('adminPanel').style.display = 'block';
        loadAllStudents();
    } else {
        document.getElementById('loginError').style.display = 'block';
    }
}

function logout() {
    document.getElementById('loginSection').style.display = 'block';
    document.getElementById('adminPanel').style.display = 'none';
    document.getElementById('username').value = '';
    document.getElementById('password').value = '';
}

function showTab(tabId) {
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    event.target.classList.add('active');
}

function getGrade(marks) {
    if(marks >= 90) return "A+";
    if(marks >= 80) return "A";
    if(marks >= 70) return "B+";
    if(marks >= 60) return "B";
    if(marks >= 50) return "C";
    return "Fail";
}

function getDivision(percent) {
    if(percent >= 60) return "First";
    if(percent >= 50) return "Second";
    if(percent >= 33) return "Third";
    return "Fail";
}

function saveStudent() {
    let name = document.getElementById('sname').value;
    let roll = document.getElementById('roll').value;
    let studentClass = document.getElementById('sclass').value;
    let year = document.getElementById('syear').value;
    
    if(!name || !roll || !studentClass || !year) {
        alert("Please fill all required fields (* marked)!");
        return;
    }
    
    // Get marks
    let marks = {
        quran: parseInt(document.getElementById('m1').value) || 0,
        hifz: parseInt(document.getElementById('m2').value) || 0,
        deeniyat: parseInt(document.getElementById('m3').value) || 0,
        urdu: parseInt(document.getElementById('m4').value) || 0,
        english: parseInt(document.getElementById('m5').value) || 0,
        hindi: parseInt(document.getElementById('m6').value) || 0,
        science: parseInt(document.getElementById('m7').value) || 0,
        social: parseInt(document.getElementById('m8').value) || 0,
        math: parseInt(document.getElementById('m9').value) || 0,
        dua: parseInt(document.getElementById('m10').value) || 0
    };
    
    let total = Object.values(marks).reduce((a, b) => a + b, 0);
    let percent = (total / 10);
    let pass = total >= 330;
    
    let student = {
        roll: roll,
        name: name,
        fname: document.getElementById('fname').value,
        mname: document.getElementById('mname').value,
        class: studentClass,
        year: year,
        dob: document.getElementById('sdob').value,
        address: document.getElementById('saddress').value,
        total: total,
        percent: percent.toFixed(1) + "%",
        pass: pass,
        division: getDivision(percent),
        marks: marks
    };
    
    // Get existing data
    let students = JSON.parse(localStorage.getItem(DATA_KEY) || "[]");
    
    // Check if roll exists
    let existingIndex = students.findIndex(s => s.roll === roll && s.class === studentClass && s.year === year);
    if(existingIndex >= 0) {
        if(!confirm("Roll number already exists! Overwrite?")) return;
        students[existingIndex] = student;
    } else {
        students.push(student);
    }
    
    localStorage.setItem(DATA_KEY, JSON.stringify(students));
    alert("Student saved successfully!");
    clearForm();
    loadAllStudents();
}

function loadAllStudents() {
    let students = JSON.parse(localStorage.getItem(DATA_KEY) || "[]");
    
    // Sort by total
    students.sort((a, b) => b.total - a.total);
    
    // Calculate ranks
    students.forEach((s, i) => s.rank = i + 1);
    
    let tbody = document.getElementById('studentBody');
    tbody.innerHTML = "";
    
    students.forEach(s => {
        tbody.innerHTML += `
            <tr>
                <td>${s.roll}</td>
                <td>${s.name}</td>
                <td>${s.class}</td>
                <td>${s.year}</td>
                <td>
